name: Zentry APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear proyecto Android
        run: |
          mkdir -p android-app/app/src/main/java/com/zentry/app
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          cp public/icon-192.png android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ZentryApp'
          include ':app'
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zentry.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zentry.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:label="Zentry"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/zentry/app/MainActivity.java <<'EOF'
          package com.zentry.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.webkit.PermissionRequest;
          import android.webkit.SslErrorHandler;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.LinearLayout;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private static final int FILE_REQUEST = 1;
              private static final int PERM_REQUEST = 2;
              private static final String DEFAULT_URL = "https://localhost:3000";

              private WebView web;
              private SharedPreferences prefs;
              private ValueCallback<Uri[]> fileCallback;
              private PermissionRequest pendingPermission;
              private String serverUrl;
              private boolean errorShown;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  prefs = getSharedPreferences("zentry", MODE_PRIVATE);
                  web = new WebView(this);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  View topBar = new View(this);
                  topBar.setBackgroundColor(0xFF1F2C34);
                  View bottomBar = new View(this);
                  bottomBar.setBackgroundColor(0xFF0B141A);
                  root.addView(topBar, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0));
                  root.addView(web, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));
                  root.addView(bottomBar, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0));
                  root.setOnApplyWindowInsetsListener((view, insets) -> {
                      topBar.getLayoutParams().height = insets.getSystemWindowInsetTop();
                      bottomBar.getLayoutParams().height = insets.getSystemWindowInsetBottom();
                      topBar.requestLayout();
                      bottomBar.requestLayout();
                      return insets;
                  });
                  setContentView(root);
                  root.requestApplyInsets();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          String host = serverUrl == null ? null : Uri.parse(serverUrl).getHost();
                          String errorHost = Uri.parse(error.getUrl()).getHost();
                          if (host != null && host.equals(errorHost)) {
                              handler.proceed();
                          } else {
                              handler.cancel();
                          }
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) showError();
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri target = request.getUrl();
                          String host = serverUrl == null ? null : Uri.parse(serverUrl).getHost();
                          if (host != null && host.equals(target.getHost())) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, target));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQUEST);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> handlePermission(request));
                      }
                  });

                  serverUrl = prefs.getString("url", DEFAULT_URL);
                  web.loadUrl(serverUrl);
              }

              private void handlePermission(PermissionRequest request) {
                  List<String> need = new ArrayList<>();
                  for (String resource : request.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)
                              && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          need.add(Manifest.permission.RECORD_AUDIO);
                      }
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)
                              && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          need.add(Manifest.permission.CAMERA);
                      }
                  }
                  if (need.isEmpty()) {
                      request.grant(request.getResources());
                      return;
                  }
                  pendingPermission = request;
                  requestPermissions(need.toArray(new String[0]), PERM_REQUEST);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] permissions, int[] results) {
                  super.onRequestPermissionsResult(code, permissions, results);
                  if (code != PERM_REQUEST || pendingPermission == null) return;
                  boolean ok = true;
                  for (int result : results) {
                      if (result != PackageManager.PERMISSION_GRANTED) ok = false;
                  }
                  if (ok) {
                      pendingPermission.grant(pendingPermission.getResources());
                  } else {
                      pendingPermission.deny();
                  }
                  pendingPermission = null;
              }

              @Override
              protected void onActivityResult(int code, int result, Intent data) {
                  if (code == FILE_REQUEST && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result, data));
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(code, result, data);
              }

              private void askUrl() {
                  EditText input = new EditText(this);
                  input.setHint("192.168.1.10:3000");
                  input.setSingleLine(true);
                  if (serverUrl != null) input.setText(serverUrl);
                  new AlertDialog.Builder(this)
                          .setTitle("Dirección del servidor Zentry")
                          .setView(input)
                          .setCancelable(false)
                          .setPositiveButton("Conectar", (dialog, which) -> {
                              String value = input.getText().toString().trim();
                              if (value.isEmpty()) {
                                  askUrl();
                                  return;
                              }
                              if (!value.startsWith("http://") && !value.startsWith("https://")) {
                                  boolean local = value.startsWith("localhost") || value.startsWith("127.");
                                  value = (local ? "http://" : "https://") + value;
                              }
                              serverUrl = value;
                              prefs.edit().putString("url", value).apply();
                              web.loadUrl(value);
                          })
                          .show();
              }

              private void showError() {
                  if (errorShown) return;
                  errorShown = true;
                  new AlertDialog.Builder(this)
                          .setTitle("No se pudo conectar")
                          .setMessage(serverUrl)
                          .setCancelable(false)
                          .setPositiveButton("Reintentar", (dialog, which) -> {
                              errorShown = false;
                              web.loadUrl(serverUrl);
                          })
                          .setNegativeButton("Cambiar dirección", (dialog, which) -> {
                              errorShown = false;
                              askUrl();
                          })
                          .show();
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compilar APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Zentry.apk
          gh release create "apk-${{ github.run_number }}" Zentry.apk --title "Zentry APK ${{ github.run_number }}" --notes "APK de Zentry"
